-- 1. Create tickets table
create table if not exists public.tickets (
  id uuid primary key default gen_random_uuid(),
  user_id uuid references auth.users(id) on delete cascade not null,
  customer_email text not null,
  subject text,
  body text not null,
  risk text check (risk in ('low','medium','high')) not null,
  reason text check (reason in ('pricing','bug','missing feature','support','competitor','other')) not null,
  summary text,
  score float not null,
  created_at timestamptz default now() not null
);

-- 2. Enable RLS
alter table public.tickets enable row level security;

-- 3. Policies (user can only see own)
create policy "Users can CRUD own tickets"
on public.tickets for all
using (auth.uid() = user_id)
with check (auth.uid() = user_id);

-- 4. Indexes
create index if not exists idx_tickets_user_created on public.tickets(user_id, created_at desc);
create index if not exists idx_tickets_risk on public.tickets(risk);

-- 5. Optional profiles table for billing
create table if not exists public.profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  is_pro boolean default false,
  stripe_customer_id text,
  created_at timestamptz default now()
);
alter table public.profiles enable row level security;
create policy "own profile" on public.profiles for all using (auth.uid() = id) with check (auth.uid() = id);

// Env: OLLAMA_URL=https://your-ollama.fly.dev or http://localhost:11434
// Model: llama3.1 / mistral / qwen2
import { serve } from "https://deno.land/std/http/server.ts";

const OLLAMA_URL = Deno.env.get("OLLAMA_URL") || "http://localhost:11434";
const PROMPT = (subject:string, body:string) => \`
You are ChurnWhisper, a churn risk classifier.
Classify churn risk and extract reason.

Input:
Subject: \${subject}
Body: \${body}

Output STRICT JSON only:
{
  "risk": "low" | "medium" | "high",
  "reason": "pricing" | "bug" | "missing feature" | "support" | "competitor" | "other",
  "summary": "one sentence <=20 words",
  "score": 0.0-1.0
}

Rules:
- high: cancel, refund, leaving, angry, blocking bug, pricing threat
- medium: frustrated, considering, renewal risk, missing must-have
- low: question, thanks, low intent
- reason from pricing, bug, missing feature, support, competitor, other
\`;

serve(async (req) => {
  if (req.method !== "POST") return new Response("POST only", {status:405});
  const { subject, body } = await req.json();

  // Call Ollama
  const ollamaRes = await fetch(\`\${OLLAMA_URL}/api/generate\`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model: "llama3.1",
      prompt: PROMPT(subject||"", body||""),
      stream: false,
      format: "json"
    })
  });
  if (!ollamaRes.ok) {
    // Fallback: let frontend heuristic handle
    return new Response(JSON.stringify({ error:"ollama failed" }), {status:502});
  }
  const { response } = await ollamaRes.json();
  try {
    const parsed = JSON.parse(response);
    return new Response(JSON.stringify(parsed), {headers:{"Content-Type":"application/json"}});
  } catch {
    // Try extract JSON
    const m = response.match(/\\{[^}]*\\}/);
    if (m) return new Response(m[0], {headers:{"Content-Type":"application/json"}});
    return new Response(JSON.stringify({ risk:"medium", reason:"other", summary:"Parse failed", score:0.5 }), {headers:{"Content-Type":"application/json"}});
  }
});
